# fly.toml app configuration file generated for rvg-aplppg on 2026-11-13T19:33:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rvg-aplppg'
primary_region = 'ams'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
